[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"


# Закрываем рабочие кабинеты от индексации. Реальная защита выполняется авторизацией и RLS в Supabase.
[[headers]]
  for = "/manager.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[build.environment]
  NODE_VERSION = "22"
